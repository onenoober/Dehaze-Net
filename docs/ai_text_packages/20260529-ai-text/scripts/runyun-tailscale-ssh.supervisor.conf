[program:runyun-tailscale-ssh]
command=/bin/bash /root/workspace/tailscale-ssh/supervisor-keepalive.sh
directory=/root/workspace/tailscale-ssh
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/root/workspace/tailscale-ssh/logs/supervisor-keepalive.out.log
stderr_logfile=/root/workspace/tailscale-ssh/logs/supervisor-keepalive.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
